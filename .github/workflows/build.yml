name: Build DSA Lab

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build all C programs
        run: make

      - name: Show build output
        run: find build -type f -maxdepth 3 | sort
